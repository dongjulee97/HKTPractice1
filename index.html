<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="Style.css">
    <div class="header">
        <div class="nav-container">
            

            <div class="navleft">
                <a href="#"> <img src="logo.svg" class="logoimg">
                </a>
                <p class="navtext">
                    <span class="title">Chicago Drive and Learn</span> 
                    <span class="subtitle"> Event Hub</span>
                </p>
            </div>

            <nav class="navright"> 
                <a href="#" class="nav-link"> Registration </a>
                <a href="#" class="nav-link"> Activities </a>
                <a href="#" class="nav-link"> Replays </a>
            </nav>

        </div>    
    </div>


    <div class="hero">
        <div class="herohead"> Registration</div>
        <div class="herosubhead">Complete all steps to register for the May 7th Tennessee Proving Grounds Drive & Learn event</div>
    </div>
    
   
    <section class="graybox"> 
        <div class="formcard">
                <div class="formtitle"> Identity & Profile</div>

                <form class="formbox">
                    <div class="field">
                        <label>Legal First Name*</label>
                        <input type="first name" placeholder="John" required>
                    </div>
                    <div class="field"> 
                        <label>Legal Last Name*</label>
                        <input type="last name" placeholder="Doe" required>
                    </div>
                    <div class="field">
                        <label>Preferred Name</label>
                        <input type="preferredname" placeholder="Defaults to first name" required>
                    </div>

                    <div class="field"> 
                        <label>Email</label>
                        <input type="email" placeholder="johndoe@gmail.com" required>
                    </div>
                    <div class="field">
                        <label>Phone Number*</label>
                        <input type="phone" placeholder="(000) 000-0000" required>
                    </div>
                    <div class="field">
                        <label>Date of Birth*</label>
                        <input type="dob" placeholder="mm/dd/yyyy" required>
                    </div>

                    <div class="field">
                        <label>Company*</label>
                        <input type="company" placeholder="Acne Coporation" required>
                    </div>
                    <div class="field">
                        <label>Job Title*</label>
                        <input type="job" placeholder="Senior Manager" required>
                    </div>

                </form>

                <form>
                    <div class="field2">
                        <label>Address*</label>
                        <div class="field2box">
                        <input type="street" placeholder="123 Main Street*" required>
                        <input type="apt" placeholder="Apt, Suite, Floor (optional)" required>
                        <input type="city" placeholder="City*" required>
                        <input type="state" placeholder="State*" required>
                        <input type="zipcode" placeholder="Zip Code*" required>
                        <select required ="country-select">
                            <option value="" disabled selected>Country*</option>
                            <option value="us">United States</option>
                            <option value="kr">South Korea</option>
                            <option value="ca">Canada</option>
                            <option value="jp">Japan</option>
                        </select>
                        </div>

                    </div>

                </form>
                
                <div class="btn-parent"> 
                    <button class="pill-btn">Continue
                        <img src="arrow.svg" alt="arrow">
                    </button>
                </div>


            </div>


        </div>

    </section>












    </div>
</html>
